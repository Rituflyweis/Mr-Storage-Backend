<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendor Selection Update</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.6; margin: 0; padding: 0; background: #f9fafb;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding: 24px;">
    <tr>
      <td align="center">
        <table role="presentation" width="620" cellspacing="0" cellpadding="0" style="background: #ffffff; border: 1px solid #e5e7eb; border-radius: 10px;">
          <tr>
            <td style="padding: 24px 28px;">
              <h2 style="margin: 0 0 8px; color: #9a3412;">Vendor Selection Update</h2>
              <p>Hello {{VENDOR_NAME}},</p>
              <p>Thank you for your quote submission for:</p>
              <p><strong>Project:</strong> {{PROJECT_NAME}}<br/><strong>Job ID:</strong> {{JOB_ID}}</p>
              <p>At this time, another vendor was selected for this requirement.</p>
              <p>We appreciate your support and look forward to working with you on future requests.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
